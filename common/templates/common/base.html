<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML//EN">
<html>
<head>
<title>The Antisocial Network</title>

<script src="/static/common/js/jquery-1.11.1.js"></script>
<script src="/static/common/js/apputils.js"></script>
{% block extrajs %}
{% endblock %}

<link href="/static/common/main.css" type="text/css" rel="stylesheet"/>
{% block extracss %}
{% endblock %}
</head>

<body>
  <div id="header">
    <table width = "100%">
      <tr>
      <td width="30%" align="left">
	<a href="/feed">RSS Feed</a><br>
        <a href="/">Home</a>
      </td>

      <td width="40%">
	<div class="centered-outer">
          <div class="centered">
	    {% block header %}
	    {% endblock %}
	  </div>
	</div>
      </td>

      <td width="30%" align="right">
	{% if viewer %}
          You are logged in as: <a href="/{{viewer.publicName}}">{{viewer.publicName}}</a>&nbsp;
           <a href="/accounts/logout">Logout</a>&nbsp;
	{% else %}
	  <!--<a href="/">Login</a> &nbsp;&nbsp; <a href="/accounts/create">Sign Up</a> -->
	{% endif %}
      </td>
      </tr>
    </table>
  </div>


  <table width="100%">
    <tr>
      <td width="80%" id="main">
	<div id="content-container" class="centered-outer">
	  <div id="content" class="centered">
            {% block content %}
            {% endblock %}
	  </div>
	</div>
      </td>
      <td width = "20%" id="sidebar" valign="top">
	<div class="navigation">
          {% block sidebar %}
          {% endblock %}
	</div>
      </td>
    </tr>
  </table>

</body>
</html>
